<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laceration Note</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <h2 class="title">Procedure Note: Laceration</h2>

            <div data-section="consent"></div>

            <div data-section="location">
                <h3>Location</h3>
                <button>right</button>
                <button>left</button>
                <button>scalp</button>
                <button>forehead</button>
                <button>lip</button>
                <button>chin</button>
                <button>arm</button>
                <button>hand</button>
                <button>finger</button>
                <button>chest</button>
                <button>back</button>
                <button>abdomen</button>
                <button>leg</button>
                <button>foot</button>
                <button>toe</button>
                <textarea></textarea>
            </div>

            <div data-section="length">
                <h3>Length (cm)</h3>
                <textarea></textarea>
            </div>

            <div data-section="cleaning">
                <h3>Cleaning</h3>
                <button data-text="the wound was copiously pressure irrigated with sterile fluids">pressure irrigation</button>
                <button data-text="the wound was cleaned with chlorhexidine">chlorhexidine</button>
                <textarea></textarea>
            </div>

            <div data-section="foreignbody">
                <h3>Foreign body</h3>
                <button data-text="no foreign body present in the wound on direct visualization and exploration">none</button>
                <button data-text="no foreign body was noted on XR prior to wound closure">XR verification</button>
                <textarea></textarea>
            </div>

            <div data-section="anesthetic">
                <h3>Anesthetic</h3>
                <button data-text="lidocaine">lidocaine</button>
                <button data-text="lidocaine with epinephrine">lido w/ epinephrine</button>
                <button data-text="bupivacaine">bupivacaine</button>
                <button data-text="topical anesthetic was applied to the wound prior to repair">topical</button>
                <button data-text="a regional nerve block was used for anesthetic">regional nerve block</button>
                <textarea placeholder="Enter volume of anesthetic here"></textarea>
            </div>

            <div data-section="suturetechnique">
                <h3>Suture technique</h3>
                <button >single layer</button>
                <button >multi-layer repair</button>
                <button >3-0</button>
                <button >4-0</button>
                <button >5-0</button>
                <button >6-0</button>
                <button data-text="nylon sutures">nylon</button>
                <button data-text="prolene sutures">prolene</button>
                <button data-text="vicryl sutures">vicryl</button>
                <button data-text="vicryl rapide sutures">vicryl rapide</button>
                <button data-text="fast-absorbing gut sutures">fast-absorbing gut</button>
                <button data-text="simple interrupted sutures">simple interrupted</button>
                <button >running sutures</button>
                <button data-text="deep dermal sutures placed">dermal sutures</button>
                <button >subcuticular sutures</button>
                <button >horizontal mattress sutures</button>
                <button >vertical mattress sutures</button>
                <textarea placeholder="Enter number of sutures"></textarea>
            </div>

            <div data-section="othertechniques">
                <h3>Other techniques</h3>
                <button >staples</button>
                <button >adhesive glue</button>
                <button >steri-strips</button>
                <textarea placeholder="Enter number of staples"></textarea>
            </div>

            <div data-section="postprocedure">
                <h3>Post-procedure</h3>
                <button data-text="following repair of the wound, appropriate approximation and cosmesis was achieved">good approximation/cosmesis</button>
                <button data-text="due to concern for possible infection, the wound was repaired with loose approximation">loose approximation</button>
                <button data-text="a sterile dressing was applied to the wound">sterile dressing</button>
                <textarea></textarea>
            </div>

            <div data-section="tetanus">
                <h3>Tetanus</h3>
                <button data-text="the patient was up to date on their tetanus vaccination status">UTD</button>
                <button data-text="the patient received a tetanus vaccination">tetanus updated</button>
                <textarea></textarea>
            </div>

            <div data-section="complications">
                <h3>Complications</h3>
                <button >none</button>
                <button data-text="there was a mild amount of bleeding that was controlled at the time of procedure completion">bleeding</button>
                <button data-text="the patient experienced pain despite anesthetic application">pain</button>
                <textarea></textarea>
            </div>

            <div data-section="provider">
                <h3>Provider</h3>
                <textarea></textarea>
            </div>
        </div>

        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutput()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
    </div>

    <footer>
    </footer>

    <script src="jstest/general.js"></script>
    <script src="jstest/shared.js"></script>
    <script>
        loadShared('consent');
    </script>
</body>
</html>
