<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Examination</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html#home">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <h2 class="title">Physical Examination</h2>

                <!-- GENERAL -->
            <div data-section="general">
                <h3>General</h3>
                <button data-text="the patient is in no acute distress">no distress</button>
                <button data-text="the patient is noted to be uncomfortable">uncomfortable</button>
                <button data-text="the patient appears ill">ill-appearing</button>
                <button data-text="the patient appears toxic">toxic-appearing</button>
                <button data-text="the patient is diaphoretic">diaphoretic</button>
                <button data-text="the patient appears well">well-appearing</button>
                <textarea></textarea>
            </div>

            <div data-section="heent">
                <!-- HEENT -->
                <h3>HEENT</h3>
                <button>normal conjunctivae</button>
                <button data-text="normal TM noted bilaterally">normal TM bilaterally</button>
                <button data-text="pupils are equal, round, and reactive to light">PERRL</button>
                <button data-text="extraocular movements are intact">EOMI</button>
                <button data-text="mucous membranes are moist">moist mucous membranes</button>
                <button data-text="mucous membranes are dry">dry mucous membranes</button>
                <button data-text="pharyngeal erythema was present">pharyngeal erythema</button>
                <button data-text="no pharyngeal erythema was noted">no pharyngeal erythema</button>
                <button data-text="the oropharynx was clear">clear oropharynx</button>
                <button data-text="tonsillar exudates were present">tonsillar exudates</button>
                <textarea></textarea>
            </div>
                
            <div data-section="neck">
                <!-- NECK -->
                <h3>Neck</h3>
                <button data-text="the neck was supple">supple</button>
                <button data-text="no meningismus was present">no meningismus</button>
                <button data-text="tender cervical lymphadenopathy was present">tender cervical LAD</button>
                <button data-text="no cervical lymphadenopathy was present">no cervical LAD</button>
                <button data-text="the trachea was midline">midline trachea</button>
                <textarea></textarea>
            </div>
                
            <div data-section="cardiac">
                <!-- CARDIAC -->
                <h3>Cardiac</h3>
                <button data-text="heart had regular rate and rhythm">regular rate and rhythm</button>
                <button data-text="the patient was tachycardic">tachycardic</button>
                <button data-text="the patient was bradycardic">bradycardic</button>
                <button data-text="a murmur was appreciated">murmur present</button>
                <button data-text="no murmur was appreciated">no murmur</button>
                <button data-text="distal pulses were normal">normal pulses</button>
                <button data-text="an irregular rhythm was present">irregular rhythm</button>
                <textarea></textarea>
            </div>
                
            <div data-section="respiratory">
                <!-- RESPIRATORY -->
                <h3>Respiratory</h3>
                <button data-text="breath sounds were normal bilaterally">normal breath sounds</button>
                <button data-text="no respiratory distress was noted">no respiratory distress</button>
                <button data-text="wheezing was present">wheezing</button>
                <button data-text="rales were noted">rales</button>
                <button data-text="rhonchi were noted">rhonchi</button>
                <button data-text="breath sounds were diminished">diminished breath sounds</button>
                <button data-text="the patient was tachypneic">tachypnea</button>
                <textarea></textarea>
            </div>
                
            <div data-section="abdominal">
                <!-- ABDOMINAL -->
                <h3>Abdominal</h3>
                <button data-text="the abdomen was soft and nontender">soft and nontender</button>
                <button data-text="the abdomen was tender to palpation">tender</button>
                <button data-text="the abdomen was distended">distended</button>
                <button data-text="no rebound or guarding was noted">no rebound/guarding</button>
                <button data-text="rebound or guarding was present">rebound/guarding present</button>
                <button data-text="bowel sounds were hyperactive">hyperactive bowel sounds</button>
                <button data-text="bowel sounds were hypoactive">hypoactive bowel sounds</button>
                <textarea></textarea>
            </div>
                
            <div data-section="msk">
                <!-- MSK -->
                <h3>MSK</h3>
                <button data-text="normal range of motion">normal ROM</button>
                <button data-text="limited range of motion was noted">limited ROM</button>
                <button data-text="no deformity was present">no deformity</button>
                <button data-text="a deformity was present">deformity present</button>
                <button data-text="there was tenderness to palpation">tenderness</button>
                <button data-text="no tenderness to palpation">no tenderness</button>
                <textarea></textarea>
            </div>
                
            <div data-section="skin">
                <!-- SKIN -->
                <h3>Skin</h3>
                <button data-text="the skin was warm and dry">warm and dry</button>
                <button data-text="the skin was cool to touch">cool</button>
                <button data-text="the patient was diaphoretic">diaphoretic</button>
                <button data-text="a rash was present">rash present</button>
                <button data-text="no rash was noted">no rash</button>
                <button data-text="pallor was noted">pallor</button>
                <button data-text="the patient appeared jaundiced">jaundiced</button>
                <textarea></textarea>
            </div>
                
            <div data-section="neuro">
                <!-- NEURO -->
                <h3>Neuro</h3>
                <button data-text="the patient was alert and oriented to person, place, and time">alert and oriented x3</button>
                <button data-text="the patient had a GCS of 15">GCS 15</button>
                <button data-text="cranial nerves II-XII were intact">cranial nerves intact</button>
                <button data-text="no focal neurologic deficits were noted">no focal deficits</button>
                <button data-text="a focal neurologic deficit was present">focal deficit present</button>
                <button data-text="strength was 5/5 in all extremities">normal strength</button>
                <button data-text="weakness was noted in the affected extremity">weakness</button>
                <button data-text="sensation was intact">normal sensation</button>
                <button data-text="a sensory deficit was noted">sensation deficit</button>
                <textarea></textarea>
            </div>
                
            <div data-section="psych">
                <!-- PSYCH -->
                <h3>Psych</h3>
                <button data-text="the patient had a normal mood and affect">normal mood/affect</button>
                <button data-text="the patient appeared anxious">anxious</button>
                <button data-text="the patient appeared depressed">depressed</button>
                <button data-text="the patient was agitated">agitated</button>
                <button data-text="the patient exhibited a flat affect">flat affect</button>
                <button data-text="the patient was cooperative">cooperative</button>
                <button data-text="the patient was uncooperative">uncooperative</button>
                <textarea></textarea>

            </div>
        </div>

        <div class="output-section">
            <div id="outputArea"></div>
            <button onclick="copyOutpur()">Copy to Clipboard</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
    </div>

    <footer></footer>

<script src="jstest/general.js"></script>
</body>
</html>
